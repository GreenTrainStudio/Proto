<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Hidden Neighbor Puzzle</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#0f172a;background:linear-gradient(135deg,#dbeafe,#e0e7ff,#ede9fe);padding:16px}.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:16px}.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.72);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.15);padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1{margin:0;font-size:28px}.sub{color:#64748b;font-size:14px;margin-top:4px}button{border:0;border-radius:10px;padding:10px 14px;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}.board{width:min(700px,100%);aspect-ratio:1;margin:0 auto;border-radius:0;background:#1e293b;padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:0}.tile{position:relative;border:2px solid rgba(255,255,255,.25);border-radius:0;overflow:hidden;cursor:grab;user-select:none}.tile:active{cursor:grabbing}.tile.hidden{background:linear-gradient(135deg,#334155,#0f172a);display:grid;place-items:center}.tile.group{box-shadow:0 0 0 2px rgba(103,232,249,.28)}.tile.dragging-group{opacity:.62}.tile.hint{outline:3px solid #f59e0b;outline-offset:-3px;animation:hintPulse .8s ease-in-out infinite alternate}@keyframes hintPulse{from{filter:brightness(1)}to{filter:brightness(1.2)}}.q{color:rgba(255,255,255,.9);font-weight:700;font-size:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 8px}.num,.grp{position:absolute;font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px}.num{top:4px;left:4px;background:rgba(0,0,0,.45)}.grp{right:4px;bottom:4px;background:rgba(6,182,212,.9)}.small{font-size:12px;color:#64748b}.big{font-size:28px;font-weight:800}.stats{margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill,.box{background:#e2e8f0;border-radius:14px;padding:12px}@media (max-width:980px){.wrap{grid-template-columns:1fr}}</style>
</head><body><div class="wrap"><section class="card"><div class="header"><div><h1>Hidden Neighbor Puzzle</h1><div class="sub">Кусочки определяются только при открытии</div></div><div style="display:flex;gap:8px"><button id="hintBtn" type="button">Подсказка</button><button id="newGame">Новая игра</button></div></div><div id="board" class="board"></div></section><aside class="card"><div class="small" style="text-transform:uppercase;font-weight:700;letter-spacing:.08em">Статус</div><div id="message" style="font-size:22px;font-weight:800;margin-top:4px">...</div><div class="stats"><div class="pill"><div class="small">Ходы</div><div id="moves" class="big">0</div></div><div class="pill"><div class="small">Группы</div><div id="groups" class="big">0</div></div></div><div class="box">Неоткрытая клетка не имеет назначенного кусочка до открытия.</div></aside></div>
<script>
(()=>{const SIZE=7,TOTAL=49,IMG='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80';
const state={game:null,dragFrom:null,dragGroupId:null,dragPositions:null,hintPair:null}; const $b=document.getElementById('board'),$m=document.getElementById('message'),$mv=document.getElementById('moves'),$g=document.getElementById('groups');
const i2rc=i=>({r:Math.floor(i/SIZE),c:i%SIZE}),rc2i=(r,c)=>r*SIZE+c,inB=(r,c)=>r>=0&&r<SIZE&&c>=0&&c<SIZE,edge=(a,b)=>`${Math.min(a,b)}-${Math.max(a,b)}`;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function neigh(i){const {r,c}=i2rc(i),o=[];if(r>0)o.push(rc2i(r-1,c));if(r<SIZE-1)o.push(rc2i(r+1,c));if(c>0)o.push(rc2i(r,c-1));if(c<SIZE-1)o.push(rc2i(r,c+1));return o}
function canMerge(p,np,pos,npos){const a=i2rc(p),b=i2rc(np),x=i2rc(pos),y=i2rc(npos);return b.r-a.r===y.r-x.r&&b.c-a.c===y.c-x.c&&Math.abs(b.r-a.r)+Math.abs(b.c-a.c)===1}
function ensureAssigned(g,positions){const unassigned=[]; for(let i=0;i<TOTAL;i++) if(g.board[i]===null) unassigned.push(i); for(const pos of positions){ if(g.board[pos]!==null) continue; const take=(Math.random()*g.pool.length)|0; const piece=g.pool.splice(take,1)[0]; g.board[pos]=piece; }}
function revealAround(g,positions){const open=[]; for(const pos of positions){if(!g.revealed[pos]){g.revealed[pos]=true;open.push(pos)} for(const n of neigh(pos)) if(!g.revealed[n]){g.revealed[n]=true;open.push(n)}} ensureAssigned(g,open)}
function groupPos(g,id){const out=[];for(let i=0;i<TOTAL;i++){const p=g.board[i]; if(p!==null&&g.pieceGroup[p]===id) out.push(i)} return out}
function hasMergeNow(g){for(let pos=0;pos<TOTAL;pos++){const p=g.board[pos]; if(p===null||!g.revealed[pos]) continue; for(const npos of neigh(pos)){const np=g.board[npos]; if(np===null||!g.revealed[npos]) continue; const a=g.pieceGroup[p],b=g.pieceGroup[np],k=edge(p,np); if(a!==b&&!g.completedEdges.has(k)&&canMerge(p,np,pos,npos)) return true;}} return false}
function ensureInitialMerge(g){if(hasMergeNow(g)) return; const rev=[]; for(let i=0;i<TOTAL;i++) if(g.revealed[i]) rev.push(i); for(const pos of rev){for(const npos of neigh(pos)){if(!g.revealed[npos]) continue; const aRC=i2rc(pos),bRC=i2rc(npos),dr=bRC.r-aRC.r,dc=bRC.c-aRC.c; for(let a=0;a<TOTAL;a++){const ar=i2rc(a),br=ar.r+dr,bc=ar.c+dc; if(!inB(br,bc)) continue; const b=rc2i(br,bc); const k=edge(a,b); if(g.pieceGroup[a]===g.pieceGroup[b]||g.completedEdges.has(k)) continue; const posA=g.board.indexOf(a),posB=g.board.indexOf(b); if(posA<0||posB<0) continue; [g.board[pos],g.board[posA]]=[g.board[posA],g.board[pos]]; [g.board[npos],g.board[posB]]=[g.board[posB],g.board[npos]]; if(hasMergeNow(g)) return; [g.board[npos],g.board[posB]]=[g.board[posB],g.board[npos]]; [g.board[pos],g.board[posA]]=[g.board[posA],g.board[pos]]; }}}}
function findHintPair(g){for(let pos=0;pos<TOTAL;pos++){const p=g.board[pos]; if(p===null||!g.revealed[pos]) continue; for(const npos of neigh(pos)){const np=g.board[npos]; if(np===null||!g.revealed[npos]) continue; const a=g.pieceGroup[p],b=g.pieceGroup[np],k=edge(p,np); if(a!==b&&!g.completedEdges.has(k)&&canMerge(p,np,pos,npos)) return [pos,npos];}} return null;}
function mergeIfNeeded(g,changed){let merged=true,found=0;const check=new Set();changed.forEach(p=>{check.add(p);neigh(p).forEach(n=>check.add(n))});
while(merged){merged=false; for(const pos of check){const p=g.board[pos]; if(p===null||!g.revealed[pos]) continue; for(const npos of neigh(pos)){const np=g.board[npos]; if(np===null||!g.revealed[npos]) continue; const a=g.pieceGroup[p],b=g.pieceGroup[np],k=edge(p,np); if(a!==b&&!g.completedEdges.has(k)&&canMerge(p,np,pos,npos)){const keep=Math.min(a,b),rm=Math.max(a,b); g.pieceGroup=g.pieceGroup.map(v=>v===rm?keep:v); g.completedEdges.add(k); found++; groupPos(g,keep).forEach(pp=>{check.add(pp);neigh(pp).forEach(n=>check.add(n))}); merged=true;}}}}
if(found>0){const all=[];for(let i=0;i<TOTAL;i++){const p=g.board[i]; if(p!==null){for(const n of neigh(i)){const np=g.board[n]; if(np!==null&&g.pieceGroup[p]===g.pieceGroup[np]){all.push(i);break}}}} revealAround(g,all)} return found}
function tryMove(g,from,to,forcedMoving=null){if(from===to)return null; const p=g.board[from]; if(p===null) return null;
const gid=g.pieceGroup[p]; const moving=forcedMoving&&forcedMoving.length?forcedMoving.slice():groupPos(g,gid);
const fromRC=i2rc(from),toRC=i2rc(to),dr=toRC.r-fromRC.r,dc=toRC.c-fromRC.c;
const movingSet=new Set(moving); const targets=[];
for(const pos of moving){const a=i2rc(pos),nr=a.r+dr,nc=a.c+dc; if(!inB(nr,nc)) return null; targets.push(rc2i(nr,nc));}
const nb=g.board.slice(),nr=g.revealed.slice();
const targetSet=new Set(targets),incoming=targets.filter(pos=>!movingSet.has(pos)),outgoing=moving.filter(pos=>!targetSet.has(pos));
if(incoming.length!==outgoing.length) return null;
const incomingByRel=new Map();
for(const pos of incoming){const a=i2rc(pos); incomingByRel.set(`${a.r-toRC.r},${a.c-toRC.c}`,pos);}
for(const pos of outgoing){const a=i2rc(pos); const key=`${a.r-fromRC.r},${a.c-fromRC.c}`; const src=incomingByRel.get(key); if(src===undefined) return null; nb[pos]=g.board[src]; nr[pos]=g.revealed[src];}
for(let i=0;i<moving.length;i++){const src=moving[i],dst=targets[i]; nb[dst]=g.board[src]; nr[dst]=g.revealed[src];}
g.board=nb; g.revealed=nr; return [...new Set([...moving,...targets])];}
function makeGame(){const rev=Array(TOTAL).fill(false); const start=(Math.random()*TOTAL)|0; rev[start]=true; const ns=neigh(start); if(ns.length>0) rev[ns[(Math.random()*ns.length)|0]]=true; const ids=sh([...Array(TOTAL).keys()].filter(i=>!rev[i])); for(let i=0;i<3;i++) rev[ids[i]]=true; const board=Array(TOTAL).fill(null); const pool=sh([...Array(TOTAL).keys()]); const g={board,revealed:rev,pool,pieceGroup:[...Array(TOTAL).keys()],completedEdges:new Set(),moves:0,message:'Открой картинку, соединяя правильных соседей'}; ensureAssigned(g,rev.map((v,i)=>v?i:-1).filter(i=>i>=0)); ensureInitialMerge(g); return g}
function won(g){let solved=0; for(let i=0;i<TOTAL;i++) if(g.board[i]===i) solved++; return solved===TOTAL||new Set(g.pieceGroup).size===1}
function render(){const g=state.game; $m.textContent=g.message; $mv.textContent=g.moves; $g.textContent=new Set(g.pieceGroup).size; $b.innerHTML='';
for(let pos=0;pos<TOTAL;pos++){const piece=g.board[pos],tile=document.createElement('div'); const hinted=state.hintPair&&(state.hintPair[0]===pos||state.hintPair[1]===pos); tile.className='tile'; tile.draggable=!won(g); if(won(g)) tile.style.cursor='default';
let gid=null,gs=1; if(piece!==null){gid=g.pieceGroup[piece]; gs=g.pieceGroup.reduce((n,v)=>n+(v===gid?1:0),0)} if(gs>1) tile.classList.add('group'); if(state.dragGroupId!==null&&gid===state.dragGroupId) tile.classList.add('dragging-group'); if(hinted) tile.classList.add('hint');
if(g.revealed[pos]&&piece!==null){const upSame=(()=>{const m=i2rc(pos);return inB(m.r-1,m.c)&&g.board[rc2i(m.r-1,m.c)]!==null&&g.pieceGroup[g.board[rc2i(m.r-1,m.c)]]===gid})();
const dnSame=(()=>{const m=i2rc(pos);return inB(m.r+1,m.c)&&g.board[rc2i(m.r+1,m.c)]!==null&&g.pieceGroup[g.board[rc2i(m.r+1,m.c)]]===gid})();
const lfSame=(()=>{const m=i2rc(pos);return inB(m.r,m.c-1)&&g.board[rc2i(m.r,m.c-1)]!==null&&g.pieceGroup[g.board[rc2i(m.r,m.c-1)]]===gid})();
const rtSame=(()=>{const m=i2rc(pos);return inB(m.r,m.c+1)&&g.board[rc2i(m.r,m.c+1)]!==null&&g.pieceGroup[g.board[rc2i(m.r,m.c+1)]]===gid})();
const c=gs>1?'#67e8f9':'rgba(255,255,255,.25)'; tile.style.borderTopColor=upSame?'transparent':c; tile.style.borderBottomColor=dnSame?'transparent':c; tile.style.borderLeftColor=lfSame?'transparent':c; tile.style.borderRightColor=rtSame?'transparent':c;
const rc=i2rc(piece); tile.style.backgroundImage=`url(${IMG})`; tile.style.backgroundSize=`${SIZE*100}% ${SIZE*100}%`; tile.style.backgroundPosition=`${(rc.c/(SIZE-1))*100}% ${(rc.r/(SIZE-1))*100}%`; const n=document.createElement('div'); n.className='num'; n.textContent=piece+1; tile.appendChild(n); if(gs>1){const gr=document.createElement('div'); gr.className='grp'; gr.textContent='x'+gs; tile.appendChild(gr)}
}else{tile.classList.add('hidden'); const q=document.createElement('div'); q.className='q'; q.textContent='?'; tile.appendChild(q)}
 tile.addEventListener('dragstart',e=>{state.dragFrom=pos; state.dragGroupId=(piece!==null?g.pieceGroup[piece]:null); state.dragPositions=(piece!==null&&state.dragGroupId!==null)?groupPos(g,state.dragGroupId):null; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(pos));});
 tile.addEventListener('dragover',e=>e.preventDefault()); tile.addEventListener('drop',e=>{e.preventDefault(); if(state.dragFrom!=null){let ch=tryMove(g,state.dragFrom,pos,state.dragPositions); const draggedIsGroup=state.dragPositions&&state.dragPositions.length>1; if(!ch&&state.dragFrom!==pos&&!draggedIsGroup){[g.board[state.dragFrom],g.board[pos]]=[g.board[pos],g.board[state.dragFrom]]; [g.revealed[state.dragFrom],g.revealed[pos]]=[g.revealed[pos],g.revealed[state.dragFrom]]; ch=[state.dragFrom,pos];} if(ch){const found=mergeIfNeeded(g,ch); g.moves++; state.hintPair=null; g.message=won(g)?'Пазл собран!':found>0?`Правильное объединение: ${found}`:'Пока нет правильного объединения';}} state.dragFrom=null; state.dragGroupId=null; state.dragPositions=null; render();}); tile.addEventListener('dragend',()=>{state.dragFrom=null; state.dragGroupId=null; state.dragPositions=null; render()});
$b.appendChild(tile)} }
 document.getElementById('hintBtn').addEventListener('click',()=>{state.hintPair=findHintPair(state.game); if(state.hintPair){state.game.message='Подсказка: подсвечена подходящая пара';}else{state.game.message='Сейчас нет доступной пары';} render();}); document.getElementById('newGame').addEventListener('click',()=>{state.game=makeGame();state.dragFrom=null;state.dragGroupId=null;state.dragPositions=null;state.hintPair=null;render()}); state.game=makeGame(); render();
})();
</script></body></html>
