<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Hidden Neighbor Puzzle</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#0f172a;background:linear-gradient(135deg,#dbeafe,#e0e7ff,#ede9fe);padding:16px}
    .wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:16px}
    .card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.72);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.15);padding:18px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    h1{margin:0;font-size:28px}
    .sub{color:#64748b;font-size:14px;margin-top:4px}
    button{border:0;border-radius:10px;padding:10px 14px;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}
    .btns{display:flex;gap:8px;flex-wrap:wrap}
    .hint-btn{background:#0891b2}
    .tile.hint{box-shadow:inset 0 0 0 3px #facc15,0 0 0 2px rgba(250,204,21,.45)}
    .board{width:min(700px,100%);aspect-ratio:1;margin:0 auto;background:#1e293b;padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:0}
    .tile{position:relative;border:2px solid rgba(255,255,255,.25);overflow:hidden;cursor:grab;user-select:none}
    .tile:active{cursor:grabbing}
    .tile.hidden{background:linear-gradient(135deg,#334155,#0f172a);display:grid;place-items:center}
    .tile.group{box-shadow:0 0 0 2px rgba(103,232,249,.28)}
    .tile.dragging-group{opacity:.62}
    .q{color:rgba(255,255,255,.9);font-weight:700;font-size:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 8px}
    .num,.grp{position:absolute;font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px}
    .num{top:4px;left:4px;background:rgba(0,0,0,.45)}
    .grp{right:4px;bottom:4px;background:rgba(6,182,212,.9)}
    .small{font-size:12px;color:#64748b}
    .big{font-size:28px;font-weight:800}
    .stats{margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pill,.box{background:#e2e8f0;border-radius:14px;padding:12px}
    @media (max-width:980px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="header">
        <div>
          <h1>Hidden Neighbor Puzzle</h1>
          <div class="sub">Кусочки определяются только при открытии</div>
        </div>
        <div class="btns">
          <button id="hintBtn" class="hint-btn">Подсказка</button>
          <button id="newGame">Новая игра</button>
        </div>
      </div>
      <div id="board" class="board"></div>
    </section>

    <aside class="card">
      <div class="small" style="text-transform:uppercase;font-weight:700;letter-spacing:.08em">Статус</div>
      <div id="message" style="font-size:22px;font-weight:800;margin-top:4px">...</div>
      <div class="stats">
        <div class="pill"><div class="small">Ходы</div><div id="moves" class="big">0</div></div>
        <div class="pill"><div class="small">Группы</div><div id="groups" class="big">0</div></div>
      </div>
      <div class="box">Неоткрытая клетка не имеет назначенного кусочка до открытия.</div>
    </aside>
  </div>

  <script>
  (() => {
    const CONFIG = {
      size: 7,
      total: 49,
      image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80'
    };

    const dom = {
      board: document.getElementById('board'),
      message: document.getElementById('message'),
      moves: document.getElementById('moves'),
      groups: document.getElementById('groups'),
      hintBtn: document.getElementById('hintBtn'),
      newGameBtn: document.getElementById('newGame')
    };

    const state = { game: null, dragFrom: null, dragGroupId: null, hint: null };

    const rcToIndex = (r, c) => r * CONFIG.size + c;
    const indexToRc = i => ({ r: Math.floor(i / CONFIG.size), c: i % CONFIG.size });
    const inBounds = (r, c) => r >= 0 && r < CONFIG.size && c >= 0 && c < CONFIG.size;
    const edgeKey = (a, b) => `${Math.min(a, b)}-${Math.max(a, b)}`;

    const neighbors = i => {
      const { r, c } = indexToRc(i);
      const out = [];
      if (r > 0) out.push(rcToIndex(r - 1, c));
      if (r < CONFIG.size - 1) out.push(rcToIndex(r + 1, c));
      if (c > 0) out.push(rcToIndex(r, c - 1));
      if (c < CONFIG.size - 1) out.push(rcToIndex(r, c + 1));
      return out;
    };

    const shuffled = arr => {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const canMerge = (pieceA, pieceB, posA, posB) => {
      const a = indexToRc(pieceA);
      const b = indexToRc(pieceB);
      const x = indexToRc(posA);
      const y = indexToRc(posB);
      return b.r - a.r === y.r - x.r && b.c - a.c === y.c - x.c && Math.abs(b.r - a.r) + Math.abs(b.c - a.c) === 1;
    };

    const groupPositions = (game, groupId) => {
      const out = [];
      for (let i = 0; i < CONFIG.total; i++) {
        const piece = game.board[i];
        if (piece !== null && game.pieceGroup[piece] === groupId) out.push(i);
      }
      return out;
    };

    const ensureAssigned = (game, positions) => {
      for (const pos of positions) {
        if (game.board[pos] !== null) continue;
        const take = (Math.random() * game.pool.length) | 0;
        game.board[pos] = game.pool.splice(take, 1)[0];
      }
    };

    const findHint = game => {
      for (let pos = 0; pos < CONFIG.total; pos++) {
        const piece = game.board[pos];
        if (piece === null || !game.revealed[pos]) continue;
        for (const npos of neighbors(pos)) {
          if (npos <= pos) continue;
          const npiece = game.board[npos];
          if (npiece === null || !game.revealed[npos]) continue;
          const a = game.pieceGroup[piece], b = game.pieceGroup[npiece];
          if (a !== b && !game.completedEdges.has(edgeKey(piece, npiece)) && canMerge(piece, npiece, pos, npos)) return [pos, npos];
        }
      }
      return null;
    };

    const forceHint = game => {
      if (findHint(game)) return;
      for (let pos = 0; pos < CONFIG.total; pos++) {
        if (!game.revealed[pos]) continue;
        const piece = game.board[pos];
        if (piece === null) continue;

        const from = indexToRc(pos);
        const sourcePiecePos = indexToRc(piece);

        for (const npos of neighbors(pos)) {
          if (!game.revealed[npos]) continue;
          const near = indexToRc(npos);
          const dr = near.r - from.r;
          const dc = near.c - from.c;

          const wantR = sourcePiecePos.r + dr;
          const wantC = sourcePiecePos.c + dc;
          if (!inBounds(wantR, wantC)) continue;

          const wantedPiece = rcToIndex(wantR, wantC);
          if (game.completedEdges.has(edgeKey(piece, wantedPiece))) continue;
          if (game.pieceGroup[piece] === game.pieceGroup[wantedPiece]) continue;

          let src = -1;
          for (let i = 0; i < CONFIG.total; i++) if (game.board[i] === wantedPiece) { src = i; break; }
          if (src < 0 || src === npos) continue;

          [game.board[src], game.board[npos]] = [game.board[npos], game.board[src]];
          if (findHint(game)) return;
          [game.board[src], game.board[npos]] = [game.board[npos], game.board[src]];
        }
      }
    };

    const revealAround = (game, positions) => {
      const opened = [];
      for (const pos of positions) {
        if (!game.revealed[pos]) { game.revealed[pos] = true; opened.push(pos); }
        for (const n of neighbors(pos)) if (!game.revealed[n]) { game.revealed[n] = true; opened.push(n); }
      }
      ensureAssigned(game, opened);
      forceHint(game);
    };

    const mergeIfNeeded = (game, changedPositions) => {
      let found = 0;
      let merged = true;
      const toCheck = new Set();

      changedPositions.forEach(p => {
        toCheck.add(p);
        neighbors(p).forEach(n => toCheck.add(n));
      });

      while (merged) {
        merged = false;
        for (const pos of toCheck) {
          const piece = game.board[pos];
          if (piece === null || !game.revealed[pos]) continue;

          for (const npos of neighbors(pos)) {
            const npiece = game.board[npos];
            if (npiece === null || !game.revealed[npos]) continue;

            const a = game.pieceGroup[piece];
            const b = game.pieceGroup[npiece];
            const k = edgeKey(piece, npiece);
            if (a === b || game.completedEdges.has(k) || !canMerge(piece, npiece, pos, npos)) continue;

            const keep = Math.min(a, b);
            const remove = Math.max(a, b);
            game.pieceGroup = game.pieceGroup.map(v => (v === remove ? keep : v));
            game.completedEdges.add(k);
            found++;

            groupPositions(game, keep).forEach(pp => {
              toCheck.add(pp);
              neighbors(pp).forEach(n => toCheck.add(n));
            });
            merged = true;
          }
        }
      }

      if (found > 0) {
        const all = [];
        for (let i = 0; i < CONFIG.total; i++) {
          const piece = game.board[i];
          if (piece === null) continue;
          for (const n of neighbors(i)) {
            const npiece = game.board[n];
            if (npiece !== null && game.pieceGroup[piece] === game.pieceGroup[npiece]) { all.push(i); break; }
          }
        }
        revealAround(game, all);
      }
      return found;
    };

    const tryMove = (game, from, to) => {
      if (from === to) return null;
      const a = indexToRc(from), b = indexToRc(to);
      if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return null;

      const piece = game.board[from];
      if (piece === null) return null;

      const gid = game.pieceGroup[piece];
      const moving = groupPositions(game, gid);

      if (moving.length === 1) {
        [game.board[from], game.board[to]] = [game.board[to], game.board[from]];
        [game.revealed[from], game.revealed[to]] = [game.revealed[to], game.revealed[from]];
        return [from, to];
      }

      const dr = b.r - a.r;
      const dc = b.c - a.c;
      const movingSet = new Set(moving);
      const targets = [];

      for (const pos of moving) {
        const p = indexToRc(pos);
        const nr = p.r + dr, nc = p.c + dc;
        if (!inBounds(nr, nc)) return null;
        targets.push(rcToIndex(nr, nc));
      }

      const targetSet = new Set(targets);
      const incoming = targets.filter(x => !movingSet.has(x));
      const outgoing = moving.filter(x => !targetSet.has(x));
      if (incoming.length !== outgoing.length) return null;

      const byRel = new Map();
      incoming.forEach(pos => {
        const p = indexToRc(pos);
        byRel.set(`${p.r - b.r},${p.c - b.c}`, pos);
      });

      const newBoard = game.board.slice();
      const newRev = game.revealed.slice();

      for (const pos of outgoing) {
        const p = indexToRc(pos);
        const src = byRel.get(`${p.r - a.r},${p.c - a.c}`);
        if (src == null) return null;
        newBoard[pos] = game.board[src];
        newRev[pos] = game.revealed[src];
      }

      for (let i = 0; i < moving.length; i++) {
        newBoard[targets[i]] = game.board[moving[i]];
        newRev[targets[i]] = game.revealed[moving[i]];
      }

      game.board = newBoard;
      game.revealed = newRev;
      return [...new Set([...moving, ...targets])];
    };

    const isWon = game => {
      let solved = 0;
      for (let i = 0; i < CONFIG.total; i++) if (game.board[i] === i) solved++;
      return solved === CONFIG.total || new Set(game.pieceGroup).size === 1;
    };

    const makeGame = () => {
      const start = (Math.random() * CONFIG.total) | 0;
      const revealed = Array(CONFIG.total).fill(false);
      revealed[start] = true;
      neighbors(start).forEach(n => (revealed[n] = true));

      const game = {
        board: Array(CONFIG.total).fill(null),
        revealed,
        pool: shuffled([...Array(CONFIG.total).keys()]),
        pieceGroup: [...Array(CONFIG.total).keys()],
        completedEdges: new Set(),
        moves: 0,
        message: 'Открой картинку, соединяя правильных соседей'
      };

      const opened = revealed.map((v, i) => (v ? i : -1)).filter(i => i >= 0);
      const anchor = opened[0];
      const pair = neighbors(anchor).find(n => revealed[n]);

      if (pair != null) {
        const a = indexToRc(anchor), b = indexToRc(pair);
        const dr = b.r - a.r, dc = b.c - a.c;
        const candidates = [];
        for (let piece = 0; piece < CONFIG.total; piece++) {
          const pr = indexToRc(piece);
          const nr = pr.r + dr, nc = pr.c + dc;
          if (inBounds(nr, nc)) candidates.push([piece, rcToIndex(nr, nc)]);
        }
        if (candidates.length) {
          const [p1, p2] = candidates[(Math.random() * candidates.length) | 0];
          game.board[anchor] = p1;
          game.board[pair] = p2;
          game.pool = game.pool.filter(x => x !== p1 && x !== p2);
        }
      }

      ensureAssigned(game, opened);
      forceHint(game);
      return game;
    };

    const tileBelongsToHint = pos => state.hint && state.hint.includes(pos);

    const updateStatus = () => {
      dom.message.textContent = state.game.message;
      dom.moves.textContent = state.game.moves;
      dom.groups.textContent = new Set(state.game.pieceGroup).size;
    };

    const render = () => {
      const game = state.game;
      updateStatus();
      dom.board.innerHTML = '';

      for (let pos = 0; pos < CONFIG.total; pos++) {
        const piece = game.board[pos];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.draggable = !isWon(game);
        if (isWon(game)) tile.style.cursor = 'default';

        let gid = null;
        let gsize = 1;
        if (piece !== null) {
          gid = game.pieceGroup[piece];
          gsize = game.pieceGroup.reduce((n, v) => n + (v === gid ? 1 : 0), 0);
        }

        if (gsize > 1) tile.classList.add('group');
        if (state.dragGroupId !== null && gid === state.dragGroupId) tile.classList.add('dragging-group');
        if (tileBelongsToHint(pos)) tile.classList.add('hint');

        if (game.revealed[pos] && piece !== null) {
          const m = indexToRc(pos);
          const same = (r, c) => inBounds(r, c) && game.board[rcToIndex(r, c)] !== null && game.pieceGroup[game.board[rcToIndex(r, c)]] === gid;
          const c = gsize > 1 ? '#67e8f9' : 'rgba(255,255,255,.25)';

          tile.style.borderTopColor = same(m.r - 1, m.c) ? 'transparent' : c;
          tile.style.borderBottomColor = same(m.r + 1, m.c) ? 'transparent' : c;
          tile.style.borderLeftColor = same(m.r, m.c - 1) ? 'transparent' : c;
          tile.style.borderRightColor = same(m.r, m.c + 1) ? 'transparent' : c;

          const rc = indexToRc(piece);
          tile.style.backgroundImage = `url(${CONFIG.image})`;
          tile.style.backgroundSize = `${CONFIG.size * 100}% ${CONFIG.size * 100}%`;
          tile.style.backgroundPosition = `${(rc.c / (CONFIG.size - 1)) * 100}% ${(rc.r / (CONFIG.size - 1)) * 100}%`;

          const n = document.createElement('div');
          n.className = 'num';
          n.textContent = piece + 1;
          tile.appendChild(n);

          if (gsize > 1) {
            const gr = document.createElement('div');
            gr.className = 'grp';
            gr.textContent = `x${gsize}`;
            tile.appendChild(gr);
          }
        } else {
          tile.classList.add('hidden');
          const q = document.createElement('div');
          q.className = 'q';
          q.textContent = '?';
          tile.appendChild(q);
        }

        tile.addEventListener('dragstart', e => {
          state.dragFrom = pos;
          state.dragGroupId = piece !== null ? game.pieceGroup[piece] : null;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(pos));
        });

        tile.addEventListener('dragover', e => e.preventDefault());
        tile.addEventListener('drop', e => {
          e.preventDefault();
          if (state.dragFrom != null) {
            const changed = tryMove(game, state.dragFrom, pos);
            if (changed) {
              const found = mergeIfNeeded(game, changed);
              forceHint(game);
              game.moves++;
              state.hint = null;
              game.message = isWon(game) ? 'Пазл собран!' : found > 0 ? `Правильное объединение: ${found}` : 'Доступное объединение подготовлено';
            }
          }
          state.dragFrom = null;
          state.dragGroupId = null;
          render();
        });

        tile.addEventListener('dragend', () => {
          state.dragFrom = null;
          state.dragGroupId = null;
          render();
        });

        dom.board.appendChild(tile);
      }
    };

    const onHintClick = () => {
      const hint = findHint(state.game);
      state.hint = hint;
      state.game.message = hint ? 'Подсказка: попробуйте соединить подсвеченные кусочки' : 'Подходящая пара будет создана после следующего хода';
      render();
    };

    const onNewGame = () => {
      state.game = makeGame();
      state.dragFrom = null;
      state.dragGroupId = null;
      state.hint = null;
      render();
    };

    dom.hintBtn.addEventListener('click', onHintClick);
    dom.newGameBtn.addEventListener('click', onNewGame);

    state.game = makeGame();
    render();
  })();
  </script>
</body>
</html>
